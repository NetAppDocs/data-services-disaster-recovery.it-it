---
indexpage:
  title: Documentazione NetApp Disaster Recovery
  summary: Con NetApp Disaster Recovery, puoi replicare i carichi di lavoro VMware
    e Kubernetes locali in esecuzione su storage ONTAP in un sito di disaster recovery.
  keywords: disaster, disaster recovery, bluexp, replicate, replication, cloud storage,
    vmware, kubernetes, trident protect, openshift
  lead: Il disaster recovery nel cloud è un modo resiliente e conveniente per proteggere
    i carichi di lavoro da interruzioni del sito ed eventi di danneggiamento dei dati
    (ad esempio, ransomware). Con NetApp Disaster Recovery, puoi proteggere i tuoi
    carichi di lavoro VMware e Kubernetes on-premises in esecuzione su storage ONTAP
    replicandoli in un sito di disaster recovery, come un altro sito on-premises o,
    per i carichi di lavoro VMware, un data center VMware software-defined in un cloud
    pubblico.
